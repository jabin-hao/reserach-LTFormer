# ==============================================================================
# 基线模型评估配置文件（用于对比 HardNet128 / SOSNet / HyNet 等模型）
# ==============================================================================
paths:
    log: "runs-epochs(400)-lr(0.001)-256"
    validation_data: "./data/optical/test_cut/"                  # 验证集目录
params:
    # model_name: "PVTv2"
    # weights_path: "./models/PVTv2_99.pth"
    model_name: "HardNet128"                                     # 评估使用的基线模型名称
    weights_path: "./models/HardNet128.pth"                      # 对应基线权重路径
    image_size: 384                                              # 模型输入分辨率
    patch_size: 192                                              # 裁剪半边长
    matching_threshold: 0.0005                                   # 描述子距离匹配阈值
    distance_matching_threshold: 5                               # 关键点定位误差容忍阈值（像素）
